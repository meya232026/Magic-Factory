# Every push and pull request: the timelines, the bundles, the Python and every score (node check.mjs --sound), then
# the six example pages, uploaded as an artifact you can download and open offline.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node check.mjs --sound
      - run: node sims/build.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: cutaway-pages
          path: cutaway-out/dist/
          if-no-files-found: error
